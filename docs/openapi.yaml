openapi: 3.0.3
info:
  title: Bank Cards REST API
  version: 1.0.0
  description: API для управления банковскими картами, пользователями и переводами.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Получить JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/admin/users:
    post:
      tags: [Admin Users]
      summary: Создать пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    get:
      tags: [Admin Users]
      summary: Список пользователей
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'

  /api/admin/users/{id}:
    get:
      tags: [Admin Users]
      summary: Получить пользователя
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    patch:
      tags: [Admin Users]
      summary: Обновить пользователя
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Пользователь обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    delete:
      tags: [Admin Users]
      summary: Удалить пользователя
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '204':
          description: Удалено

  /api/admin/cards:
    post:
      tags: [Admin Cards]
      summary: Создать карту
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardCreateRequest'
      responses:
        '201':
          description: Карта создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
    get:
      tags: [Admin Cards]
      summary: Список всех карт
      parameters:
        - name: ownerId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CardStatus'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница карт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'

  /api/admin/cards/{id}:
    get:
      tags: [Admin Cards]
      summary: Получить карту
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Карта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
    delete:
      tags: [Admin Cards]
      summary: Удалить карту
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '204':
          description: Удалено

  /api/admin/cards/{id}/status:
    patch:
      tags: [Admin Cards]
      summary: Изменить статус карты
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardStatusRequest'
      responses:
        '200':
          description: Статус изменен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'

  /api/admin/cards/{id}/block:
    patch:
      tags: [Admin Cards]
      summary: Заблокировать карту
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Карта заблокирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'

  /api/admin/cards/{id}/activate:
    patch:
      tags: [Admin Cards]
      summary: Активировать карту
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Карта активирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'

  /api/cards:
    get:
      tags: [User Cards]
      summary: Список своих карт
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CardStatus'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница карт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'

  /api/cards/{id}:
    get:
      tags: [User Cards]
      summary: Получить свою карту
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Карта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'

  /api/cards/{id}/balance:
    get:
      tags: [User Cards]
      summary: Посмотреть баланс своей карты
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Баланс
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'

  /api/cards/{id}/request-block:
    patch:
      tags: [User Cards]
      summary: Запросить блокировку своей карты
      parameters:
        - $ref: '#/components/parameters/UuidPath'
      responses:
        '200':
          description: Запрос принят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'

  /api/transfers:
    post:
      tags: [Transfers]
      summary: Перевод между своими картами
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '201':
          description: Перевод выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UuidPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/UserResponse'
    Role:
      type: string
      enum: [ADMIN, USER]
    UserCreateRequest:
      type: object
      required: [username, password, fullName, role]
      properties:
        username:
          type: string
          maxLength: 100
        password:
          type: string
          minLength: 8
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    UserUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        enabled:
          type: boolean
        password:
          type: string
          minLength: 8
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CardStatus:
      type: string
      enum: [ACTIVE, BLOCKED, EXPIRED]
    CardCreateRequest:
      type: object
      required: [cardNumber, ownerId, expiryDate, balance]
      properties:
        cardNumber:
          type: string
          pattern: '^\d{13,19}$'
        ownerId:
          type: string
          format: uuid
        expiryDate:
          type: string
          format: date
        balance:
          type: number
          minimum: 0
    CardStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/CardStatus'
    CardResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        maskedNumber:
          type: string
          example: '**** **** **** 1234'
        ownerId:
          type: string
          format: uuid
        ownerUsername:
          type: string
        ownerFullName:
          type: string
        expiryDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/CardStatus'
        balance:
          type: number
        blockRequested:
          type: boolean
    BalanceResponse:
      type: object
      properties:
        cardId:
          type: string
          format: uuid
        maskedNumber:
          type: string
        balance:
          type: number
    TransferRequest:
      type: object
      required: [fromCardId, toCardId, amount]
      properties:
        fromCardId:
          type: string
          format: uuid
        toCardId:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0.01
    TransferResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fromCardId:
          type: string
          format: uuid
        toCardId:
          type: string
          format: uuid
        amount:
          type: number
        createdAt:
          type: string
          format: date-time
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/UserResponse'
    CardPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/CardResponse'
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        validationErrors:
          type: object
          additionalProperties:
            type: string
