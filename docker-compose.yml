services:
  postgres:
    image: postgres:16-alpine
    container_name: bankcards-postgres
    environment:
      POSTGRES_DB: bankcards
      POSTGRES_USER: bankcards
      POSTGRES_PASSWORD: bankcards
    ports:
      - "5432:5432"
    volumes:
      - bankcards-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankcards -d bankcards"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: bankcards-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bankcards
      SPRING_DATASOURCE_USERNAME: bankcards
      SPRING_DATASOURCE_PASSWORD: bankcards
      JWT_SECRET: change-this-demo-secret-change-this-demo-secret
      CARD_ENCRYPTION_KEY: change-this-32-byte-card-secret!!
    ports:
      - "8080:8080"

volumes:
  bankcards-postgres-data:
